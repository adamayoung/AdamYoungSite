<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Principles of Object-Oriented Design — eight pill-shaped chips labelled with the principle acronyms, grouped into a SOLID row of five (SRP, OCP, LSP, ISP, DIP) above a Components row of three (REP, CCP, CRP).">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3efe6"/>
      <stop offset="100%" stop-color="#e7ded0"/>
    </linearGradient>
    <radialGradient id="aurora1" cx="12%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aurora2" cx="88%" cy="86%" r="60%">
      <stop offset="0%" stop-color="#ca8a04" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15241c"/>
      <stop offset="100%" stop-color="#1d3326"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#65a30d"/>
    </linearGradient>

    <!-- Chip surface (warm paper card) -->
    <linearGradient id="chipFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#faf7f0" stop-opacity="0.98"/>
    </linearGradient>

    <!-- SOLID chip stroke (emerald→lime) -->
    <linearGradient id="solidStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#059669" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#65a30d" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Components chip stroke (lime→emerald) -->
    <linearGradient id="compStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#65a30d" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#aurora1)"/>
  <rect width="1200" height="630" fill="url(#aurora2)"/>

  <!-- Top accent rule -->
  <line x1="80" y1="82" x2="142" y2="82" stroke="url(#accent)" stroke-width="2" stroke-linecap="round"/>

  <!-- Kicker -->
  <text x="80" y="108" font-family="ui-monospace, SF Mono, Menlo, monospace"
        font-size="13" font-weight="600" fill="#059669" letter-spacing="3.5">ARCHITECTURE  ·  SOLID</text>

  <!-- Title -->
  <text x="80" y="194" font-family="-apple-system, SF Pro Display, Helvetica, Arial, sans-serif"
        font-size="60" font-weight="700" fill="url(#title)" letter-spacing="-1.6">Principles of Object-Oriented Design</text>

  <!-- Subtitle -->
  <text x="80" y="234" font-family="-apple-system, SF Pro Text, Helvetica, Arial, sans-serif"
        font-size="22" font-weight="400" fill="#5b6b60" letter-spacing="-0.1">SOLID, plus three for components.</text>

  <!-- ============== BESPOKE MARK ============== -->
  <!-- Mark frame is 460 wide, anchored top-right of the available area -->
  <g transform="translate(660, 290)">

    <!-- ===== SOLID group ===== -->
    <line x1="0" y1="6" x2="14" y2="6" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
    <text x="22" y="11" font-family="ui-monospace, SF Mono, Menlo, monospace"
          font-size="11" font-weight="700" fill="#059669" letter-spacing="3">SOLID</text>
    <line x1="76" y1="6" x2="460" y2="6" stroke="#059669" stroke-opacity="0.28" stroke-width="1"/>

    <!-- 5 chips in a single row, gap 12, chip 80×40, total 5*80+4*12 = 448, centred in 460 -->
    <g font-family="ui-monospace, SF Mono, Menlo, monospace" font-weight="700"
       letter-spacing="2.5" text-anchor="middle">

      <!-- SRP -->
      <g transform="translate(6, 32)">
        <rect width="80" height="40" rx="20" fill="url(#chipFill)" stroke="url(#solidStroke)" stroke-width="1.4"/>
        <text x="40" y="26" font-size="15" fill="#059669">SRP</text>
      </g>
      <!-- OCP -->
      <g transform="translate(98, 32)">
        <rect width="80" height="40" rx="20" fill="url(#chipFill)" stroke="url(#solidStroke)" stroke-width="1.4"/>
        <text x="40" y="26" font-size="15" fill="#059669">OCP</text>
      </g>
      <!-- LSP -->
      <g transform="translate(190, 32)">
        <rect width="80" height="40" rx="20" fill="url(#chipFill)" stroke="url(#solidStroke)" stroke-width="1.4"/>
        <text x="40" y="26" font-size="15" fill="#059669">LSP</text>
      </g>
      <!-- ISP -->
      <g transform="translate(282, 32)">
        <rect width="80" height="40" rx="20" fill="url(#chipFill)" stroke="url(#solidStroke)" stroke-width="1.4"/>
        <text x="40" y="26" font-size="15" fill="#059669">ISP</text>
      </g>
      <!-- DIP -->
      <g transform="translate(374, 32)">
        <rect width="80" height="40" rx="20" fill="url(#chipFill)" stroke="url(#solidStroke)" stroke-width="1.4"/>
        <text x="40" y="26" font-size="15" fill="#059669">DIP</text>
      </g>
    </g>

    <!-- ===== Components group ===== -->
    <line x1="0" y1="116" x2="14" y2="116" stroke="#65a30d" stroke-width="2" stroke-linecap="round"/>
    <text x="22" y="121" font-family="ui-monospace, SF Mono, Menlo, monospace"
          font-size="11" font-weight="700" fill="#65a30d" letter-spacing="3">COMPONENTS</text>
    <line x1="120" y1="116" x2="460" y2="116" stroke="#65a30d" stroke-opacity="0.28" stroke-width="1"/>

    <!-- 3 chips, smaller. 76×34, gap 14. Total 3*76+2*14 = 256. Centred under SOLID row → start x=(460-256)/2 = 102 -->
    <g font-family="ui-monospace, SF Mono, Menlo, monospace" font-weight="700"
       letter-spacing="2.5" text-anchor="middle">
      <!-- REP -->
      <g transform="translate(102, 142)">
        <rect width="76" height="34" rx="17" fill="url(#chipFill)" stroke="url(#compStroke)" stroke-width="1.4"/>
        <text x="38" y="22" font-size="14" fill="#65a30d">REP</text>
      </g>
      <!-- CCP -->
      <g transform="translate(192, 142)">
        <rect width="76" height="34" rx="17" fill="url(#chipFill)" stroke="url(#compStroke)" stroke-width="1.4"/>
        <text x="38" y="22" font-size="14" fill="#65a30d">CCP</text>
      </g>
      <!-- CRP -->
      <g transform="translate(282, 142)">
        <rect width="76" height="34" rx="17" fill="url(#chipFill)" stroke="url(#compStroke)" stroke-width="1.4"/>
        <text x="38" y="22" font-size="14" fill="#65a30d">CRP</text>
      </g>
    </g>
  </g>

  <!-- Footer -->
  <line x1="80" y1="552" x2="1120" y2="552" stroke="#d8cfbe" stroke-width="1"/>
  <text x="80" y="582" font-family="ui-monospace, SF Mono, Menlo, monospace"
        font-size="12" font-weight="500" fill="#9a917f" letter-spacing="2">ADAM YOUNG  ·  2026.05.04</text>
  <text x="1120" y="582" text-anchor="end" font-family="ui-monospace, SF Mono, Menlo, monospace"
        font-size="12" font-weight="500" fill="#9a917f" letter-spacing="2">ADAM-YOUNG.CO.UK</text>
</svg>
