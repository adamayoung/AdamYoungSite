<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="When AI Forgets Wonder — a free-flowing constellation of stars connected by thin lines, like a map of thoughts cast across the night sky. The connections suggest thinking; the stars suggest wonder.">
  <defs>
    <!-- Vertical sunset sky: deep plum → warm rose → amber horizon glow -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#1a1033"/>
      <stop offset="38%"  stop-color="#3a1840"/>
      <stop offset="72%"  stop-color="#6b2438"/>
      <stop offset="100%" stop-color="#8a3a2c"/>
    </linearGradient>
    <!-- Low-sun amber horizon glow near the bottom -->
    <radialGradient id="horizon" cx="50%" cy="100%" r="80%">
      <stop offset="0%"   stop-color="#fbbf24" stop-opacity="0.45"/>
      <stop offset="45%"  stop-color="#f59e42" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aurora1" cx="20%" cy="78%" r="58%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aurora2" cx="82%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f1f5fb"/>
      <stop offset="100%" stop-color="#c5cdda"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <radialGradient id="focalHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#fef3c7" stop-opacity="0.85"/>
      <stop offset="40%"  stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nodeHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#f472b6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#horizon)"/>
  <rect width="1200" height="630" fill="url(#aurora1)"/>
  <rect width="1200" height="630" fill="url(#aurora2)"/>

  <!-- Top accent rule -->
  <line x1="80" y1="82" x2="142" y2="82" stroke="url(#accent)" stroke-width="2" stroke-linecap="round"/>

  <!-- Kicker -->
  <text x="80" y="108" font-family="ui-monospace, SF Mono, Menlo, monospace"
        font-size="13" font-weight="600" fill="#fbbf24" letter-spacing="3.5">ON ARTIFICIAL INTELLIGENCE</text>

  <!-- Title -->
  <text x="80" y="194" font-family="-apple-system, SF Pro Display, Helvetica, Arial, sans-serif"
        font-size="60" font-weight="700" fill="url(#title)" letter-spacing="-1.6">When AI Forgets Wonder</text>

  <!-- Subtitle -->
  <text x="80" y="234" font-family="-apple-system, SF Pro Text, Helvetica, Arial, sans-serif"
        font-size="22" font-weight="400" fill="#e7c9c2" letter-spacing="-0.1">How we lose ourselves by thinking less.</text>

  <!-- ============== BESPOKE MARK ============== -->
  <!-- Mark frame: 460×290, translate(660, 250) -->
  <g transform="translate(660, 250)">

    <!-- Ambient stippled starfield -->
    <g fill="#ffffff">
      <circle cx="38"  cy="22"  r="0.7" opacity="0.45"/>
      <circle cx="80"  cy="60"  r="0.9" opacity="0.50"/>
      <circle cx="48"  cy="100" r="0.7" opacity="0.40"/>
      <circle cx="140" cy="38"  r="0.8" opacity="0.45"/>
      <circle cx="200" cy="92"  r="0.7" opacity="0.40"/>
      <circle cx="246" cy="28"  r="0.9" opacity="0.50"/>
      <circle cx="320" cy="110" r="0.7" opacity="0.40"/>
      <circle cx="408" cy="52"  r="0.8" opacity="0.50"/>
      <circle cx="430" cy="160" r="0.7" opacity="0.40"/>
      <circle cx="60"  cy="200" r="0.8" opacity="0.45"/>
      <circle cx="120" cy="234" r="0.7" opacity="0.40"/>
      <circle cx="180" cy="180" r="0.9" opacity="0.50"/>
      <circle cx="250" cy="240" r="0.7" opacity="0.40"/>
      <circle cx="340" cy="200" r="0.7" opacity="0.40"/>
      <circle cx="376" cy="244" r="0.8" opacity="0.45"/>
      <circle cx="20"  cy="160" r="0.8" opacity="0.40"/>
      <circle cx="160" cy="260" r="0.7" opacity="0.40"/>
      <circle cx="290" cy="56"  r="0.7" opacity="0.40"/>
    </g>

    <!-- Constellation lines (the threads of thought) -->
    <g stroke="#f472b6" stroke-opacity="0.42" stroke-width="0.9" fill="none" stroke-linecap="round">
      <!-- Web around the focal node -->
      <line x1="220" y1="135" x2="100"  y2="80"/>   <!-- focal → A -->
      <line x1="220" y1="135" x2="180"  y2="60"/>   <!-- focal → B -->
      <line x1="220" y1="135" x2="320"  y2="70"/>   <!-- focal → C -->
      <line x1="220" y1="135" x2="380"  y2="170"/>  <!-- focal → D -->
      <line x1="220" y1="135" x2="280"  y2="220"/>  <!-- focal → E -->
      <line x1="220" y1="135" x2="120"  y2="210"/>  <!-- focal → F -->
      <line x1="220" y1="135" x2="80"   y2="150"/>  <!-- focal → G -->
      <!-- Outer arcs between satellites -->
      <line x1="100" y1="80"  x2="180"  y2="60"/>
      <line x1="180" y1="60"  x2="320"  y2="70"/>
      <line x1="320" y1="70"  x2="380"  y2="170"/>
      <line x1="380" y1="170" x2="280"  y2="220"/>
      <line x1="280" y1="220" x2="120"  y2="210"/>
      <line x1="120" y1="210" x2="80"   y2="150"/>
      <line x1="80"  y1="150" x2="100"  y2="80"/>
    </g>

    <!-- Satellite node stars (the constellation vertices — the thoughts) -->
    <g>
      <!-- A: top-left -->
      <circle cx="100" cy="80"  r="14" fill="url(#nodeHalo)"/>
      <circle cx="100" cy="80"  r="2.4" fill="#fcd9a8"/>
      <!-- B: top-centre -->
      <circle cx="180" cy="60"  r="14" fill="url(#nodeHalo)"/>
      <circle cx="180" cy="60"  r="2.2" fill="#fcd9a8"/>
      <!-- C: top-right -->
      <circle cx="320" cy="70"  r="14" fill="url(#nodeHalo)"/>
      <circle cx="320" cy="70"  r="2.6" fill="#fcd9a8"/>
      <!-- D: right -->
      <circle cx="380" cy="170" r="14" fill="url(#nodeHalo)"/>
      <circle cx="380" cy="170" r="2.4" fill="#fcd9a8"/>
      <!-- E: bottom-right -->
      <circle cx="280" cy="220" r="14" fill="url(#nodeHalo)"/>
      <circle cx="280" cy="220" r="2.2" fill="#fcd9a8"/>
      <!-- F: bottom-left -->
      <circle cx="120" cy="210" r="14" fill="url(#nodeHalo)"/>
      <circle cx="120" cy="210" r="2.4" fill="#fcd9a8"/>
      <!-- G: left -->
      <circle cx="80"  cy="150" r="14" fill="url(#nodeHalo)"/>
      <circle cx="80"  cy="150" r="2.2" fill="#fcd9a8"/>
    </g>

    <!-- The focal star — warm, slightly off-centre, the "spark" of wonder/thought -->
    <circle cx="220" cy="135" r="46" fill="url(#focalHalo)"/>
    <g transform="translate(220, 135)">
      <path d="M 0 -14 L 4 -4 L 14 0 L 4 4 L 0 14 L -4 4 L -14 0 L -4 -4 Z" fill="#fef3c7"/>
      <circle r="2.6" fill="#ffffff"/>
    </g>

    <!-- Caption -->
    <text x="230" y="282" text-anchor="middle"
          font-family="ui-monospace, SF Mono, Menlo, monospace"
          font-size="11" font-weight="600" fill="#a08398" letter-spacing="3.5" font-style="italic">WHAT IF THERE'S MORE?</text>
  </g>

  <!-- Footer -->
  <line x1="80" y1="552" x2="1120" y2="552" stroke="#4a2a32" stroke-width="1"/>
  <text x="80" y="582" font-family="ui-monospace, SF Mono, Menlo, monospace"
        font-size="12" font-weight="500" fill="#a8857e" letter-spacing="2">ADAM YOUNG  ·  2025.12.11</text>
  <text x="1120" y="582" text-anchor="end" font-family="ui-monospace, SF Mono, Menlo, monospace"
        font-size="12" font-weight="500" fill="#a8857e" letter-spacing="2">ADAM-YOUNG.CO.UK</text>
</svg>
