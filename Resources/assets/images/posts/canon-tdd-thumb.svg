<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Canon TDD — a bold circular cycle arrow transitioning from traffic-light red through to emerald, representing the Red, Green, Refactor loop.">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f0f10"/>
      <stop offset="100%" stop-color="#0a0606"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="18%" r="60%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="82%" cy="84%" r="62%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <!-- Cycle ring gradient: traffic-light red sweeping round to emerald -->
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#f43f5e"/>
      <stop offset="45%"  stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="head" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>
  <rect width="600" height="600" fill="url(#glow1)"/>
  <rect width="600" height="600" fill="url(#glow2)"/>

  <!-- Central cycle emblem: bold circular arrow, ~330px diameter, centred at 300,300.
       Ring drawn as an arc that starts top (red), sweeps clockwise ~315°, ending near
       top with an emerald arrowhead pointing into the start — the red→green→refactor loop. -->
  <g transform="translate(300,300)">
    <!-- Faint full ring track -->
    <circle cx="0" cy="0" r="165" fill="none" stroke="#3a2122" stroke-width="34" stroke-opacity="0.5"/>

    <!-- Open arc, ~300° sweep, thick. Start at top (12 o'clock), sweep clockwise
         the long way round to ~8 o'clock, leaving a gap closed by the arrowhead. -->
    <path d="M 0 -165
             A 165 165 0 1 1 -82.5 142.9"
          fill="none" stroke="url(#ring)" stroke-width="34" stroke-linecap="round"/>

    <!-- Emerald arrowhead at the END of the arc (~8 o'clock), pointing clockwise
         (tangent direction) to read as a continuous directional cycle. -->
    <g transform="translate(-82.5 142.9) rotate(-60)">
      <path d="M 0 -42 L 30 18 L -30 18 Z" fill="url(#head)"/>
    </g>

    <!-- Tiny mono kicker beneath the emblem -->
    <text x="0" y="34" text-anchor="middle"
          font-family="ui-monospace, SF Mono, Menlo, monospace"
          font-size="38" font-weight="700" fill="#cbd2dc" letter-spacing="4">TDD</text>
  </g>
</svg>
