<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="iOS Architectures, explained like a building site. A layered tower built from architecture-named floors (View, ViewModel, Domain, Use Cases, Repository, Data) with a crane lifting a block into place.">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef3f8"/>
      <stop offset="100%" stop-color="#dce6f0"/>
    </linearGradient>
    <radialGradient id="aurora1" cx="12%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aurora2" cx="88%" cy="86%" r="60%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f2742"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="floorFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#f4f8fc" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="floorStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#2563eb" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1e3a5f" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="blueprintGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 L0 40" fill="none" stroke="#1e3a5f" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#blueprintGrid)"/>
  <rect width="1200" height="630" fill="url(#aurora1)"/>
  <rect width="1200" height="630" fill="url(#aurora2)"/>

  <!-- Top accent rule -->
  <line x1="80" y1="86" x2="142" y2="86" stroke="url(#accent)" stroke-width="2" stroke-linecap="round"/>

  <!-- Kicker -->
  <text x="80" y="112" font-family="ui-monospace, SF Mono, Menlo, monospace"
        font-size="13" font-weight="600" fill="#2563eb" letter-spacing="3.5">ARCHITECTURE  ·  iOS</text>

  <!-- Title -->
  <text x="80" y="226" font-family="-apple-system, SF Pro Display, Helvetica, Arial, sans-serif"
        font-size="72" font-weight="700" fill="url(#title)" letter-spacing="-2">iOS Architectures</text>

  <!-- Subtitle -->
  <text x="80" y="272" font-family="-apple-system, SF Pro Text, Helvetica, Arial, sans-serif"
        font-size="24" font-weight="400" fill="#42566b" letter-spacing="-0.2">Explained like a building site.</text>

  <!-- Strap line -->
  <text x="80" y="360" font-family="-apple-system, SF Pro Text, Helvetica, Arial, sans-serif"
        font-size="18" font-weight="500" fill="#5a6b80" letter-spacing="0.2">MVC · MVVM · MVVM-C · VIPER · Clean</text>
  <text x="80" y="386" font-family="-apple-system, SF Pro Text, Helvetica, Arial, sans-serif"
        font-size="18" font-weight="500" fill="#5a6b80" letter-spacing="0.2">Hexagonal · Redux · TCA · RIBs</text>

  <!-- ============== Construction mark: a tower of layers + a crane ============== -->
  <g transform="translate(742, 92)">

    <!-- Crane mast -->
    <line x1="44" y1="20" x2="44" y2="438" stroke="#d97706" stroke-opacity="0.7" stroke-width="3"/>
    <!-- Crane jib -->
    <line x1="44" y1="34" x2="332" y2="34" stroke="#1e3a5f" stroke-opacity="0.7" stroke-width="3"/>
    <!-- Counter jib -->
    <line x1="44" y1="34" x2="-8" y2="34" stroke="#1e3a5f" stroke-opacity="0.55" stroke-width="3"/>
    <!-- Hook line -->
    <line x1="300" y1="34" x2="300" y2="96" stroke="#1e3a5f" stroke-opacity="0.5" stroke-width="1.6"/>
    <!-- Lifted block (amber accent layer) -->
    <rect x="262" y="96" width="86" height="40" rx="10" fill="url(#floorFill)" stroke="#d97706" stroke-width="2"/>
    <text x="305" y="121" text-anchor="middle" font-family="ui-monospace, SF Mono, Menlo, monospace"
          font-size="14" font-weight="700" fill="#d97706">View</text>

    <!-- Tower of floors (bottom up) -->
    <g font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="14" font-weight="700" text-anchor="middle">
      <!-- Data -->
      <rect x="70" y="392" width="248" height="42" rx="10" fill="url(#floorFill)" stroke="url(#floorStroke)" stroke-width="1.5"/>
      <text x="194" y="419" fill="#1e3a5f">Data</text>
      <!-- Repository -->
      <rect x="78" y="344" width="232" height="42" rx="10" fill="url(#floorFill)" stroke="url(#floorStroke)" stroke-width="1.5"/>
      <text x="194" y="371" fill="#1e3a5f">Repository</text>
      <!-- Use Cases -->
      <rect x="86" y="296" width="216" height="42" rx="10" fill="url(#floorFill)" stroke="url(#floorStroke)" stroke-width="1.5"/>
      <text x="194" y="323" fill="#1e3a5f">Use Cases</text>
      <!-- Domain -->
      <rect x="94" y="248" width="200" height="42" rx="10" fill="url(#floorFill)" stroke="url(#floorStroke)" stroke-width="1.5"/>
      <text x="194" y="275" fill="#1e3a5f">Domain</text>
      <!-- ViewModel -->
      <rect x="102" y="200" width="184" height="42" rx="10" fill="url(#floorFill)" stroke="url(#floorStroke)" stroke-width="1.5"/>
      <text x="194" y="227" fill="#2563eb">ViewModel</text>
    </g>
  </g>

  <!-- Footer -->
  <line x1="80" y1="552" x2="1120" y2="552" stroke="#c2cfdd" stroke-width="1"/>
  <text x="80" y="582" font-family="ui-monospace, SF Mono, Menlo, monospace"
        font-size="12" font-weight="500" fill="#7c8aa0" letter-spacing="2">ADAM YOUNG  ·  2026.06.12</text>
  <text x="1120" y="582" text-anchor="end" font-family="ui-monospace, SF Mono, Menlo, monospace"
        font-size="12" font-weight="500" fill="#7c8aa0" letter-spacing="2">ADAM-YOUNG.CO.UK</text>
</svg>
