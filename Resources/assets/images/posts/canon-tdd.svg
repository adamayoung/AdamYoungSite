<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Canon TDD — the five canon steps as numbered chips: 1 LIST, 2 TEST, 3 PASS, 4 REFACTOR, 5 REPEAT, connected left-to-right by arrows, with a dashed loop from step 5 back to step 2 captioned 'until the list is empty'.">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1224"/>
      <stop offset="100%" stop-color="#040810"/>
    </linearGradient>
    <radialGradient id="aurora1" cx="12%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aurora2" cx="88%" cy="86%" r="60%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f1f5fb"/>
      <stop offset="100%" stop-color="#c5cdda"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Chip surface (subtle glass) — shared with OOD hero -->
    <linearGradient id="chipFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#162133" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#0b1424" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="chipStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#22d3ee" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.85"/>
    </linearGradient>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#22d3ee"/>
    </marker>
    <marker id="arrowDim" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#7a8aa0"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#aurora1)"/>
  <rect width="1200" height="630" fill="url(#aurora2)"/>

  <!-- Top accent rule -->
  <line x1="80" y1="82" x2="142" y2="82" stroke="url(#accent)" stroke-width="2" stroke-linecap="round"/>

  <!-- Kicker -->
  <text x="80" y="108" font-family="ui-monospace, SF Mono, Menlo, monospace"
        font-size="13" font-weight="600" fill="#22d3ee" letter-spacing="3.5">TEST-DRIVEN DEVELOPMENT</text>

  <!-- Title -->
  <text x="80" y="194" font-family="-apple-system, SF Pro Display, Helvetica, Arial, sans-serif"
        font-size="60" font-weight="700" fill="url(#title)" letter-spacing="-1.6">Canon TDD</text>

  <!-- Subtitle -->
  <text x="80" y="234" font-family="-apple-system, SF Pro Text, Helvetica, Arial, sans-serif"
        font-size="22" font-weight="400" fill="#9aa6b8" letter-spacing="-0.1">Red, Green, Refactor — and the step everyone forgets.</text>

  <!-- ============== BESPOKE MARK ============== -->
  <!-- Full-width mark: 5 numbered step chips with a loop from step 5 back to step 2 -->
  <g transform="translate(80, 290)">

    <!-- Group label -->
    <line x1="0" y1="6" x2="14" y2="6" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>
    <text x="22" y="11" font-family="ui-monospace, SF Mono, Menlo, monospace"
          font-size="11" font-weight="700" fill="#22d3ee" letter-spacing="3">CANON · FIVE STEPS</text>
    <line x1="156" y1="6" x2="1040" y2="6" stroke="#22d3ee" stroke-opacity="0.18" stroke-width="1"/>

    <!-- 5 step chips: 130×40, gap 24, centred in 1040 → start x=147 -->
    <!-- Chip 1: LIST -->
    <g transform="translate(147, 36)">
      <rect width="130" height="40" rx="20" fill="url(#chipFill)" stroke="url(#chipStroke)" stroke-width="1.4"/>
      <circle cx="22" cy="20" r="13" fill="#22d3ee" fill-opacity="0.14" stroke="#22d3ee" stroke-opacity="0.85" stroke-width="1.2"/>
      <text x="22" y="25" text-anchor="middle"
            font-family="ui-monospace, SF Mono, Menlo, monospace"
            font-size="13" font-weight="700" fill="#67e8f9">1</text>
      <text x="44" y="25" text-anchor="start"
            font-family="ui-monospace, SF Mono, Menlo, monospace"
            font-size="12" font-weight="700" fill="#cbd2dc" letter-spacing="2.5">LIST</text>
    </g>

    <!-- Arrow 1→2 -->
    <line x1="282" y1="56" x2="298" y2="56" stroke="#7a8aa0" stroke-width="1.6" marker-end="url(#arrowDim)"/>

    <!-- Chip 2: TEST -->
    <g transform="translate(301, 36)">
      <rect width="130" height="40" rx="20" fill="url(#chipFill)" stroke="url(#chipStroke)" stroke-width="1.4"/>
      <circle cx="22" cy="20" r="13" fill="#22d3ee" fill-opacity="0.14" stroke="#22d3ee" stroke-opacity="0.85" stroke-width="1.2"/>
      <text x="22" y="25" text-anchor="middle"
            font-family="ui-monospace, SF Mono, Menlo, monospace"
            font-size="13" font-weight="700" fill="#67e8f9">2</text>
      <text x="44" y="25" text-anchor="start"
            font-family="ui-monospace, SF Mono, Menlo, monospace"
            font-size="12" font-weight="700" fill="#cbd2dc" letter-spacing="2.5">TEST</text>
    </g>

    <!-- Arrow 2→3 -->
    <line x1="436" y1="56" x2="452" y2="56" stroke="#7a8aa0" stroke-width="1.6" marker-end="url(#arrowDim)"/>

    <!-- Chip 3: PASS -->
    <g transform="translate(455, 36)">
      <rect width="130" height="40" rx="20" fill="url(#chipFill)" stroke="url(#chipStroke)" stroke-width="1.4"/>
      <circle cx="22" cy="20" r="13" fill="#22d3ee" fill-opacity="0.14" stroke="#22d3ee" stroke-opacity="0.85" stroke-width="1.2"/>
      <text x="22" y="25" text-anchor="middle"
            font-family="ui-monospace, SF Mono, Menlo, monospace"
            font-size="13" font-weight="700" fill="#67e8f9">3</text>
      <text x="44" y="25" text-anchor="start"
            font-family="ui-monospace, SF Mono, Menlo, monospace"
            font-size="12" font-weight="700" fill="#cbd2dc" letter-spacing="2.5">PASS</text>
    </g>

    <!-- Arrow 3→4 -->
    <line x1="590" y1="56" x2="606" y2="56" stroke="#7a8aa0" stroke-width="1.6" marker-end="url(#arrowDim)"/>

    <!-- Chip 4: REFACTOR -->
    <g transform="translate(609, 36)">
      <rect width="130" height="40" rx="20" fill="url(#chipFill)" stroke="url(#chipStroke)" stroke-width="1.4"/>
      <circle cx="22" cy="20" r="13" fill="#22d3ee" fill-opacity="0.14" stroke="#22d3ee" stroke-opacity="0.85" stroke-width="1.2"/>
      <text x="22" y="25" text-anchor="middle"
            font-family="ui-monospace, SF Mono, Menlo, monospace"
            font-size="13" font-weight="700" fill="#67e8f9">4</text>
      <text x="44" y="25" text-anchor="start"
            font-family="ui-monospace, SF Mono, Menlo, monospace"
            font-size="11" font-weight="700" fill="#cbd2dc" letter-spacing="2">REFACTOR</text>
    </g>

    <!-- Arrow 4→5 -->
    <line x1="744" y1="56" x2="760" y2="56" stroke="#7a8aa0" stroke-width="1.6" marker-end="url(#arrowDim)"/>

    <!-- Chip 5: REPEAT -->
    <g transform="translate(763, 36)">
      <rect width="130" height="40" rx="20" fill="url(#chipFill)" stroke="url(#chipStroke)" stroke-width="1.4"/>
      <circle cx="22" cy="20" r="13" fill="#22d3ee" fill-opacity="0.14" stroke="#22d3ee" stroke-opacity="0.85" stroke-width="1.2"/>
      <text x="22" y="25" text-anchor="middle"
            font-family="ui-monospace, SF Mono, Menlo, monospace"
            font-size="13" font-weight="700" fill="#67e8f9">5</text>
      <text x="44" y="25" text-anchor="start"
            font-family="ui-monospace, SF Mono, Menlo, monospace"
            font-size="12" font-weight="700" fill="#cbd2dc" letter-spacing="2.5">REPEAT</text>
    </g>

    <!-- Loop arrow: from below chip 5 (centre x=828) curving back to below chip 2 (centre x=366), arrowhead pointing UP into chip 2 -->
    <path d="M 828 80 C 828 156, 366 156, 366 82"
          fill="none" stroke="#22d3ee" stroke-opacity="0.55"
          stroke-width="1.6" stroke-dasharray="5 6"
          marker-end="url(#arrow)"/>

    <!-- Caption along the curve -->
    <text x="597" y="146" text-anchor="middle"
          font-family="ui-monospace, SF Mono, Menlo, monospace"
          font-size="11" font-weight="600" fill="#7a8aa0" letter-spacing="2.5">UNTIL THE LIST IS EMPTY</text>

    <!-- Subtle annotation: step 1 sits before the loop -->
    <text x="212" y="100" text-anchor="middle"
          font-family="ui-monospace, SF Mono, Menlo, monospace"
          font-size="10" font-weight="500" fill="#525866" letter-spacing="2.5" font-style="italic">ONCE</text>
    <text x="597" y="100" text-anchor="middle"
          font-family="ui-monospace, SF Mono, Menlo, monospace"
          font-size="10" font-weight="500" fill="#525866" letter-spacing="2.5" font-style="italic">THE CYCLE</text>
  </g>

  <!-- Footer -->
  <line x1="80" y1="552" x2="1120" y2="552" stroke="#1e2638" stroke-width="1"/>
  <text x="80" y="582" font-family="ui-monospace, SF Mono, Menlo, monospace"
        font-size="12" font-weight="500" fill="#525866" letter-spacing="2">ADAM YOUNG  ·  2026.01.21</text>
  <text x="1120" y="582" text-anchor="end" font-family="ui-monospace, SF Mono, Menlo, monospace"
        font-size="12" font-weight="500" fill="#525866" letter-spacing="2">ADAM-YOUNG.CO.UK</text>
</svg>
