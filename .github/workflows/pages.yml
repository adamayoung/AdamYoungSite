name: Build and deploy site

on:
  push:
    branches: [main]
    paths-ignore:
      - '.claude/**'
      - 'CLAUDE.md'
  # Role durations on the About page ("Jul 2026 - Present · 3 mos") are computed
  # from Date() at build time, so a static build freezes them. Rebuild on the
  # 1st of each month to keep the current role's duration honest.
  # NOTE: GitHub disables scheduled workflows after 60 days without repo
  # activity (it emails first). If the dates go stale, check this is enabled.
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: macos-26
    env:
      # Mapped to env at job level so the deploy step's `if` can read it.
      # Until the secret is set, the deploy step is skipped and the build
      # still runs green.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Cache SwiftPM build
        uses: actions/cache@v5
        with:
          path: |
            .build
            .swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build site
        run: swift run -c release AdamYoungSite

      - name: Deploy to Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy Output --project-name=adam-young-site
